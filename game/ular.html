<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Game Ular - Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            color: #4CAF50;
            font-size: 2.5em;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            color: white;
        }

        .score-box, .high-score-box {
            text-align: center;
        }

        .label {
            font-size: 0.8em;
            text-transform: uppercase;
            color: #aaa;
            letter-spacing: 2px;
        }

        .value {
            font-size: 2em;
            font-weight: bold;
            color: #4CAF50;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        canvas {
            border: 3px solid rgba(76, 175, 80, 0.5);
            border-radius: 10px;
            background: #111;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.3);
            display: block;
            margin: 0 auto;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: white;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-start {
            background: #4CAF50;
        }

        .btn-start:hover {
            background: #45a049;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        .btn-pause {
            background: #ff9800;
        }

        .btn-pause:hover {
            background: #e68900;
            box-shadow: 0 0 20px rgba(255, 152, 0, 0.5);
        }

        .btn-reset {
            background: #f44336;
        }

        .btn-reset:hover {
            background: #da190b;
            box-shadow: 0 0 20px rgba(244, 67, 54, 0.5);
        }

        .mobile-controls {
            display: none;
            margin-top: 20px;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
            justify-content: center;
        }

        .dpad button {
            padding: 0;
            font-size: 1.5em;
            background: rgba(76, 175, 80, 0.3);
            border: 2px solid rgba(76, 175, 80, 0.5);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dpad button:active {
            background: rgba(76, 175, 80, 0.6);
        }

        .dpad .empty {
            border: none;
            background: transparent;
        }

        .up { grid-column: 2; grid-row: 1; }
        .left { grid-column: 1; grid-row: 2; }
        .center { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
        .down { grid-column: 2; grid-row: 3; }

        .game-over-message {
            color: #f44336;
            font-size: 1.2em;
            margin-top: 15px;
            min-height: 30px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .mobile-controls {
                display: block;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .container {
                padding: 15px;
            }
            
            canvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 Game Ular</h1>
        
        <div class="game-header">
            <div class="score-box">
                <div class="label">Skor</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="high-score-box">
                <div class="label">Skor Tertinggi</div>
                <div class="value" id="highScore">0</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div class="game-over-message" id="gameOverMessage"></div>

        <div class="controls">
            <button class="btn-start" id="startBtn">🎮 Mulai</button>
            <button class="btn-pause" id="pauseBtn">⏸️ Jeda</button>
            <button class="btn-reset" id="resetBtn">🔄 Ulang</button>
        </div>

        <div class="mobile-controls">
            <div class="dpad">
                <button class="up" id="upBtn">⬆️</button>
                <button class="left" id="leftBtn">⬅️</button>
                <button class="center empty"></button>
                <button class="right" id="rightBtn">➡️</button>
                <button class="down" id="downBtn">⬇️</button>
            </div>
        </div>
    </div>

    <script>
        class SnakeGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                // Ukuran grid
                this.gridSize = 20;
                this.tileCount = this.canvas.width / this.gridSize;
                
                // State game
                this.snake = [];
                this.direction = { x: 0, y: 0 };
                this.nextDirection = { x: 0, y: 0 };
                this.food = {};
                this.score = 0;
                this.highScore = localStorage.getItem('snakeHighScore') || 0;
                this.gameRunning = false;
                this.gamePaused = false;
                this.gameOver = false;
                this.speed = 100; // ms per frame
                this.gameLoop = null;
                
                // Warna
                this.colors = {
                    snake: '#4CAF50',
                    snakeHead: '#8BC34A',
                    snakeBorder: '#388E3C',
                    food: '#FF5722',
                    foodGlow: '#FF9800',
                    grid: 'rgba(255, 255, 255, 0.05)',
                    background: '#1a1a1a'
                };
                
                this.initializeElements();
                this.attachEventListeners();
                this.updateHighScoreDisplay();
                this.drawInitialScreen();
            }
            
            initializeElements() {
                this.scoreSpan = document.getElementById('score');
                this.highScoreSpan = document.getElementById('highScore');
                this.gameOverMessage = document.getElementById('gameOverMessage');
                this.startBtn = document.getElementById('startBtn');
                this.pauseBtn = document.getElementById('pauseBtn');
                this.resetBtn = document.getElementById('resetBtn');
            }
            
            attachEventListeners() {
                // Keyboard controls
                document.addEventListener('keydown', (e) => this.handleKeyPress(e));
                
                // Button controls
                this.startBtn.addEventListener('click', () => this.startGame());
                this.pauseBtn.addEventListener('click', () => this.togglePause());
                this.resetBtn.addEventListener('click', () => this.resetGame());
                
                // Mobile controls
                document.getElementById('upBtn').addEventListener('click', () => this.changeDirection(0, -1));
                document.getElementById('downBtn').addEventListener('click', () => this.changeDirection(0, 1));
                document.getElementById('leftBtn').addEventListener('click', () => this.changeDirection(-1, 0));
                document.getElementById('rightBtn').addEventListener('click', () => this.changeDirection(1, 0));
                
                // Touch swipe support
                let touchStartX = 0;
                let touchStartY = 0;
                
                this.canvas.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                });
                
                this.canvas.addEventListener('touchend', (e) => {
                    const touchEndX = e.changedTouches[0].clientX;
                    const touchEndY = e.changedTouches[0].clientY;
                    
                    const dx = touchEndX - touchStartX;
                    const dy = touchEndY - touchStartY;
                    
                    if (Math.abs(dx) > Math.abs(dy)) {
                        // Horizontal swipe
                        if (dx > 0) this.changeDirection(1, 0);
                        else this.changeDirection(-1, 0);
                    } else {
                        // Vertical swipe
                        if (dy > 0) this.changeDirection(0, 1);
                        else this.changeDirection(0, -1);
                    }
                });
            }
            
            handleKeyPress(e) {
                if (!this.gameRunning || this.gamePaused) return;
                
                const key = e.key.toLowerCase();
                
                switch(key) {
                    case 'arrowup':
                    case 'w':
                        e.preventDefault();
                        this.changeDirection(0, -1);
                        break;
                    case 'arrowdown':
                    case 's':
                        e.preventDefault();
                        this.changeDirection(0, 1);
                        break;
                    case 'arrowleft':
                    case 'a':
                        e.preventDefault();
                        this.changeDirection(-1, 0);
                        break;
                    case 'arrowright':
                    case 'd':
                        e.preventDefault();
                        this.changeDirection(1, 0);
                        break;
                    case ' ':
                        e.preventDefault();
                        this.togglePause();
                        break;
                }
            }
            
            changeDirection(x, y) {
                // Mencegah ular berbalik arah
                if (this.direction.x === -x && this.direction.y === -y) return;
                if (this.direction.x === x && this.direction.y === y) return;
                
                this.nextDirection = { x, y };
            }
            
            startGame() {
                if (this.gameRunning && !this.gamePaused) return;
                
                if (!this.gameRunning || this.gameOver) {
                    this.initializeGame();
                }
                
                this.gameRunning = true;
                this.gamePaused = false;
                this.gameOver = false;
                this.gameOverMessage.textContent = '';
                
                if (this.gameLoop) clearInterval(this.gameLoop);
                this.gameLoop = setInterval(() => this.update(), this.speed);
                
                this.startBtn.textContent = '🎮 Berjalan';
                this.startBtn.style.opacity = '0.7';
            }
            
            initializeGame() {
                // Inisialisasi ular di tengah
                this.snake = [
                    { x: Math.floor(this.tileCount / 2), y: Math.floor(this.tileCount / 2) }
                ];
                this.direction = { x: 0, y: 0 };
                this.nextDirection = { x: 0, y: 0 };
                this.score = 0;
                this.updateScoreDisplay();
                this.generateFood();
            }
            
            togglePause() {
                if (!this.gameRunning || this.gameOver) return;
                
                this.gamePaused = !this.gamePaused;
                
                if (this.gamePaused) {
                    this.pauseBtn.textContent = '▶️ Lanjut';
                    this.gameOverMessage.textContent = '⏸️ Game Dijeda';
                    this.gameOverMessage.style.color = '#ff9800';
                } else {
                    this.pauseBtn.textContent = '⏸️ Jeda';
                    this.gameOverMessage.textContent = '';
                }
            }
            
            resetGame() {
                if (this.gameLoop) clearInterval(this.gameLoop);
                this.gameRunning = false;
                this.gamePaused = false;
                this.gameOver = false;
                this.initializeGame();
                this.gameOverMessage.textContent = '';
                this.startBtn.textContent = '🎮 Mulai';
                this.startBtn.style.opacity = '1';
                this.pauseBtn.textContent = '⏸️ Jeda';
                this.draw();
            }
            
            generateFood() {
                do {
                    this.food = {
                        x: Math.floor(Math.random() * this.tileCount),
                        y: Math.floor(Math.random() * this.tileCount)
                    };
                } while (this.snake.some(segment => 
                    segment.x === this.food.x && segment.y === this.food.y
                ));
            }
            
            update() {
                if (!this.gameRunning || this.gamePaused || this.gameOver) return;
                
                // Update arah
                this.direction = { ...this.nextDirection };
                
                // Jika ular belum bergerak
                if (this.direction.x === 0 && this.direction.y === 0) return;
                
                // Hitung posisi kepala baru
                const head = { ...this.snake[0] };
                head.x += this.direction.x;
                head.y += this.direction.y;
                
                // Cek tabrakan dengan dinding
                if (head.x < 0 || head.x >= this.tileCount || 
                    head.y < 0 || head.y >= this.tileCount) {
                    this.endGame();
                    return;
                }
                
                // Cek tabrakan dengan tubuh sendiri
                if (this.snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                    this.endGame();
                    return;
                }
                
                // Tambahkan kepala baru
                this.snake.unshift(head);
                
                // Cek apakah makan makanan
                if (head.x === this.food.x && head.y === this.food.y) {
                    this.score += 10;
                    this.updateScoreDisplay();
                    this.generateFood();
                    
                    // Tingkatkan kecepatan setiap 50 poin
                    if (this.score % 50 === 0 && this.speed > 50) {
                        this.speed -= 5;
                        clearInterval(this.gameLoop);
                        this.gameLoop = setInterval(() => this.update(), this.speed);
                    }
                } else {
                    // Hapus ekor jika tidak makan
                    this.snake.pop();
                }
                
                this.draw();
            }
            
            endGame() {
                this.gameOver = true;
                this.gameRunning = false;
                clearInterval(this.gameLoop);
                
                // Update high score
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('snakeHighScore', this.highScore);
                    this.updateHighScoreDisplay();
                    this.gameOverMessage.textContent = `🎉 Skor Tertinggi Baru: ${this.score}!`;
                    this.gameOverMessage.style.color = '#4CAF50';
                } else {
                    this.gameOverMessage.textContent = `💀 Game Over! Skor: ${this.score}`;
                    this.gameOverMessage.style.color = '#f44336';
                }
                
                this.startBtn.textContent = '🎮 Mulai Lagi';
                this.startBtn.style.opacity = '1';
                this.draw();
            }
            
            draw() {
                // Clear canvas
                this.ctx.fillStyle = this.colors.background;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Draw grid
                this.drawGrid();
                
                // Draw food with glow effect
                this.drawFood();
                
                // Draw snake
                this.drawSnake();
            }
            
            drawGrid() {
                this.ctx.strokeStyle = this.colors.grid;
                this.ctx.lineWidth = 0.5;
                
                for (let i = 0; i <= this.tileCount; i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(i * this.gridSize, 0);
                    this.ctx.lineTo(i * this.gridSize, this.canvas.height);
                    this.ctx.stroke();
                    
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, i * this.gridSize);
                    this.ctx.lineTo(this.canvas.width, i * this.gridSize);
                    this.ctx.stroke();
                }
            }
            
            drawFood() {
                const x = this.food.x * this.gridSize;
                const y = this.food.y * this.gridSize;
                
                // Glow effect
                this.ctx.shadowColor = this.colors.foodGlow;
                this.ctx.shadowBlur = 15;
                
                // Draw food
                this.ctx.fillStyle = this.colors.food;
                this.ctx.beginPath();
                this.ctx.arc(
                    x + this.gridSize / 2,
                    y + this.gridSize / 2,
                    this.gridSize / 2 - 2,
                    0,
                    Math.PI * 2
                );
                this.ctx.fill();
                
                // Reset shadow
                this.ctx.shadowBlur = 0;
                
                // Inner highlight
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                this.ctx.beginPath();
                this.ctx.arc(
                    x + this.gridSize / 2 - 2,
                    y + this.gridSize / 2 - 2,
                    this.gridSize / 4,
                    0,
                    Math.PI * 2
                );
                this.ctx.fill();
            }
            
            drawSnake() {
                this.snake.forEach((segment, index) => {
                    const x = segment.x * this.gridSize;
                    const y = segment.y * this.gridSize;
                    
                    if (index === 0) {
                        // Kepala ular
                        this.ctx.fillStyle = this.colors.snakeHead;
                        this.ctx.shadowColor = 'rgba(76, 175, 80, 0.5)';
                        this.ctx.shadowBlur = 10;
                    } else {
                        // Tubuh ular
                        this.ctx.fillStyle = this.colors.snake;
                        this.ctx.shadowBlur = 0;
                    }
                    
                    // Draw segment dengan border radius
                    const padding = 1;
                    const size = this.gridSize - padding * 2;
                    
                    this.ctx.fillStyle = index === 0 ? this.colors.snakeHead : this.colors.snake;
                    this.ctx.fillRect(x + padding, y + padding, size, size);
                    
                    // Border
                    this.ctx.strokeStyle = this.colors.snakeBorder;
                    this.ctx.lineWidth = 1;
                    this.ctx.strokeRect(x + padding, y + padding, size, size);
                    
                    // Mata untuk kepala
                    if (index === 0) {
                        this.drawEyes(x, y);
                    }
                });
                
                this.ctx.shadowBlur = 0;
            }
            
            drawEyes(x, y) {
                const eyeSize = 3;
                const eyeOffset = 5;
                
                let leftEye, rightEye;
                
                // Posisi mata berdasarkan arah
                if (this.direction.x === 1) { // Kanan
                    leftEye = { x: x + this.gridSize - eyeOffset, y: y + eyeOffset };
                    rightEye = { x: x + this.gridSize - eyeOffset, y: y + this.gridSize - eyeOffset };
                } else if (this.direction.x === -1) { // Kiri
                    leftEye = { x: x + eyeOffset, y: y + eyeOffset };
                    rightEye = { x: x + eyeOffset, y: y + this.gridSize - eyeOffset };
                } else if (this.direction.y === -1) { // Atas
                    leftEye = { x: x + eyeOffset, y: y + eyeOffset };
                    rightEye = { x: x + this.gridSize - eyeOffset, y: y + eyeOffset };
                } else if (this.direction.y === 1) { // Bawah
                    leftEye = { x: x + eyeOffset, y: y + this.gridSize - eyeOffset };
                    rightEye = { x: x + this.gridSize - eyeOffset, y: y + this.gridSize - eyeOffset };
                } else {
                    // Default (belum bergerak)
                    leftEye = { x: x + eyeOffset, y: y + eyeOffset };
                    rightEye = { x: x + this.gridSize - eyeOffset, y: y + eyeOffset };
                }
                
                // Draw eyes
                this.ctx.fillStyle = 'white';
                this.ctx.beginPath();
                this.ctx.arc(leftEye.x, leftEye.y, eyeSize, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.beginPath();
                this.ctx.arc(rightEye.x, rightEye.y, eyeSize, 0, Math.PI * 2);
                this.ctx.fill();
                
                // Pupils
                this.ctx.fillStyle = 'black';
                this.ctx.beginPath();
                this.ctx.arc(leftEye.x, leftEye.y, 1.5, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.beginPath();
                this.ctx.arc(rightEye.x, rightEye.y, 1.5, 0, Math.PI * 2);
                this.ctx.fill();
            }
            
            drawInitialScreen() {
                this.ctx.fillStyle = this.colors.background;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                this.drawGrid();
                
                // Draw initial message
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                this.ctx.font = '20px "Segoe UI", sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.fillText(
                    'Tekan MULAI untuk bermain',
                    this.canvas.width / 2,
                    this.canvas.height / 2
                );
                this.ctx.fillText(
                    'Gunakan Arrow Keys / WASD',
                    this.canvas.width / 2,
                    this.canvas.height / 2 + 35
                );
            }
            
            updateScoreDisplay() {
                this.scoreSpan.textContent = this.score;
            }
            
            updateHighScoreDisplay() {
                this.highScoreSpan.textContent = this.highScore;
            }
        }
        
        // Inisialisasi game saat halaman dimuat
        document.addEventListener('DOMContentLoaded', () => {
            new SnakeGame();
        });
    </script>
</body>
</html>
