const PJ_PRIORITY     = [3,9,10,13,14,25,26,2];
const TRIASE_PRIORITY = [3,4,5,6,7,8];
const SHIFT_LABEL = {P:"Pagi",S:"Sore",M:"Malam"};
const SHIFT_TIME  = {P:"07.00–14.00",S:"14.00–21.00",M:"21.00–07.00"};
const SHIFT_COLOR = {P:"#F59E0B",S:"#3B82F6",M:"#818CF8"};

function getRawShift(nurse, tanggal, schedOvr) {
  if (schedOvr && schedOvr[nurse.id] !== undefined) return schedOvr[nurse.id];
  return nurse.schedule[tanggal-1] || "L";
}

function getFormation(total) {
  if (total >= 9) return {hasPJ:true,  merah:3, kuning:4};
  if (total === 8) return {hasPJ:true,  merah:3, kuning:3};
  if (total === 7) return {hasPJ:false, merah:3, kuning:3};
  if (total === 6) return {hasPJ:false, merah:2, kuning:3};
  if (total === 5) return {hasPJ:false, merah:2, kuning:2};
  if (total === 4) return {hasPJ:false, merah:1, kuning:2};
  if (total === 3) return {hasPJ:false, merah:1, kuning:1};
  if (total === 2) return {hasPJ:false, merah:1, kuning:0};
  return {hasPJ:false, merah:0, kuning:0};
}

// Default on-call: nurses on "L", exclude karu & ppja, sorted by ID descending (bottom priority first)
function getDefaultOnCall(tanggal, shift, schedOvr, pjNurse) {
  return NURSES_BASE
    .filter(n => {
      if (n.zona === "karu") return false;
      if (n.zona === "ppja") return false;
      if (pjNurse && n.id === pjNurse.id) return false;
      return getRawShift(n, tanggal, schedOvr) === "L";
    })
    .sort((a, b) => b.id - a.id) // descending: bottom of list first
    .slice(0, 3);
}

function computeShift(tanggal, shift, schedOvr, zoneOvr, onCallOvr, roleOvr) {
  const active = NURSES_BASE.filter(n =>
    n.zona !== "karu" && getRawShift(n, tanggal, schedOvr) === shift
  );
  const total = active.length;
  const formation = getFormation(total);

  // 1. Triase
  const triasePool = active.filter(n => n.zona === "triase");
  let triaseNurse = null;
  for (const tid of TRIASE_PRIORITY) {
    const f = triasePool.find(n => n.id === tid);
    if (f) { triaseNurse = f; break; }
  }
  if (!triaseNurse && triasePool.length > 0) triaseNurse = triasePool[0];

  const ro = roleOvr || {};

if (ro.triase) {
  const forcedTriase = active.find(n => n.id === ro.triase);
  if (forcedTriase) {
    triaseNurse = forcedTriase;
  }
}
  const usedIds = new Set();
  if (triaseNurse) usedIds.add(triaseNurse.id);

  // 2. PJ
  let pjNurse = null;
  if (formation.hasPJ) {
    for (const pid of PJ_PRIORITY) {
      const f = active.find(n => n.id === pid && !usedIds.has(n.id));
      if (f) { pjNurse = f; break; }
    }
  }
 if (ro.pj) {
  const forcedPJ = active.find(
    n => n.id === ro.pj && n.id !== triaseNurse?.id
  );

  if (forcedPJ) {
    pjNurse = forcedPJ;
  }
}
  if (pjNurse) usedIds.add(pjNurse.id);

  // 3. Remaining
  const remaining = active.filter(n => {
    if (usedIds.has(n.id)) return false;
    if (n.id === 2 && pjNurse) return false;
    return true;
  });

  const zo = zoneOvr || {};
  const forcedMerah  = remaining.filter(n => zo[n.id] === "merah");
  const forcedKuning = remaining.filter(n => zo[n.id] === "kuning");
  const auto         = remaining.filter(n => !zo[n.id]);

  const merahArr  = [...forcedMerah];
  const kuningArr = [...forcedKuning];
  const autoKuning = auto.filter(n => n.zona === "kuning" || n.zona === "ppja");
  const autoMerah  = auto.filter(n => n.zona !== "kuning" && n.zona !== "ppja");

  for (const n of autoKuning) {
    if (kuningArr.length < formation.kuning) kuningArr.push(n);
    else merahArr.push(n);
  }
  for (const n of autoMerah) {
    if (merahArr.length < formation.merah) merahArr.push(n);
    else if (kuningArr.length < formation.kuning) kuningArr.push({...n, borrowedFrom:"Zona Merah"});
    else merahArr.push(n);
  }

  // 4. On Call — use override if set, otherwise default (bottom-priority first)
  let onCall;
  if (onCallOvr !== null && onCallOvr !== undefined) {
    // Manual override: resolve IDs back to nurse objects
    onCall = onCallOvr
      .map(id => NURSES_BASE.find(n => n.id === id))
      .filter(Boolean);
  } else {
    onCall = getDefaultOnCall(tanggal, shift, schedOvr, pjNurse);
  }

  return {pj:pjNurse, triase:triaseNurse, merah:merahArr, kuning:kuningArr, onCall, total, formation, active};
}

// ===== EDIT ON CALL MODAL =====
function EditOnCallModal({tanggal, shift, schedOvr, currentOnCallIds, pjNurse, onSave, onClose}) {
  // All nurses who are on "L" today, excluding karu & ppja
  const liburPool = NURSES_BASE
    .filter(n => {
      if (n.zona === "karu") return false;
      if (n.zona === "ppja") return false;
      if (pjNurse && n.id === pjNurse.id) return false;
      return getRawShift(n, tanggal, schedOvr) === "L";
    })
    .sort((a, b) => b.id - a.id); // bottom-priority first (high ID first)

  const [selected, setSelected] = useState(() => new Set(currentOnCallIds));

  const toggle = (id) => {
    setSelected(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const selectedList = liburPool.filter(n => selected.has(n.id));
  const unselectedList = liburPool.filter(n => !selected.has(n.id));

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"#1E293B",borderRadius:16,width:"100%",maxWidth:480,maxHeight:"90vh",overflow:"hidden",display:"flex",flexDirection:"column"}}>
        {/* Header */}
        <div style={{padding:"16px 20px",borderBottom:"1px solid #334155",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{color:"#F1F5F9",fontWeight:700,fontSize:16}}>📞 Edit On Call</div>
            <div style={{color:"#64748B",fontSize:12}}>
              Tgl {tanggal} · Shift {SHIFT_LABEL[shift]} · {selected.size} dipilih

          <button onClick={onClose} style={{background:"#334155",border:"none",color:"#94A3B8",borderRadius:8,padding:"6px 12px",fontSize:13}}>✕</button>
        </div>

        {/* Info */}
        <div style={{padding:"10px 20px",background:"#0C2A38",borderBottom:"1px solid #0EA5E9"}}>
          <div style={{color:"#7DD3FC",fontSize:11}}>
            💡 Prioritas otomatis: perawat dengan nomor urut paling bawah (ID besar) ditampilkan lebih dulu. Tap untuk centang/uncentang.
          </div>
        </div>

        <div style={{overflowY:"auto",flex:1,padding:"12px 20px"}}>

          {/* Selected */}
          {selectedList.length > 0 && (
            <div style={{marginBottom:14}}>
              <div style={{fontSize:10,color:"#0EA5E9",fontWeight:700,letterSpacing:"0.07em",textTransform:"uppercase",marginBottom:8}}>
                ✅ Dipilih sebagai On Call ({selectedList.length})
              </div>
              {selectedList.map(n => (
                <div key={n.id} onClick={() => toggle(n.id)}
                  style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:10,marginBottom:5,
                    background:"#0C2A38",cursor:"pointer",border:"1px solid #0EA5E9"}}>
                  <div style={{background:"#0EA5E9",color:"#fff",borderRadius:6,width:28,height:28,
                    display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:11,flexShrink:0}}>{n.id}</div>
                  <div style={{flex:1}}>
                    <div style={{color:"#E2E8F0",fontSize:13,fontWeight:500}}>{n.nama}</div>
                    <div style={{color:"#475569",fontSize:10}}>{n.zona === "triase" ? "Triase" : n.zona === "merah" ? "Zona Merah" : "Zona Kuning"}</div>
                  </div>
                  <div style={{background:"#0EA5E9",color:"#fff",borderRadius:6,padding:"3px 8px",fontSize:11,fontWeight:700}}>ON CALL</div>
                  <span style={{color:"#64748B",fontSize:12}}>✕</span>
                </div>
              ))}
            </div>
          )}

          {/* Unselected */}
          {unselectedList.length > 0 && (
            <div>

              </div>
              {unselectedList.map(n => (
                <div key={n.id} onClick={() => toggle(n.id)}

                  <div style={{background:"#1E293B",color:"#64748B",borderRadius:6,width:28,height:28,
                    display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:11,flexShrink:0}}>{n.id}</div>
                  <div style={{flex:1}}>
                    <div style={{color:"#94A3B8",fontSize:13}}>{n.nama}</div>
                    <div style={{color:"#334155",fontSize:10}}>{n.zona === "triase" ? "Triase" : n.zona === "merah" ? "Zona Merah" : "Zona Kuning"}</div>

// ===== MAIN APP =====
function App() {
  const [tanggal, setTanggal] = useState(1);
  const [shift, setShift]     = useState("P");
  const [showEditSched,   setShowEditSched]   = useState(false);
  const [showEditZone,    setShowEditZone]    = useState(false);
  const [showEditOnCall,  setShowEditOnCall]  = useState(false);
  const [schedOverrides,  setSchedOverrides]  = useState({});
  const [zoneOverrides,   setZoneOverrides]   = useState({});
  const [onCallOverrides, setOnCallOverrides] = useState({}); // {tanggal: {shift: [id,...]}}
 const [showEditRole, setShowEditRole] = useState(false);
const [roleOverrides, setRoleOverrides] = useState({});

  const flatSchedOvr   = schedOverrides[tanggal] || {};
  const flatZoneOvr    = ((zoneOverrides[tanggal] || {})[shift]) || {};
  const flatOnCallOvr  = ((onCallOverrides[tanggal] || {})[shift]) ?? null; // null = use default
 const flatRoleOvr = ((roleOverrides[tanggal] || {})[shift]) || {};

  const assignment = useMemo(
  () => computeShift(tanggal, shift, flatSchedOvr, flatZoneOvr, flatOnCallOvr, flatRoleOvr),
  [
    tanggal,
    shift,
    JSON.stringify(flatSchedOvr),
    JSON.stringify(flatZoneOvr),
    JSON.stringify(flatOnCallOvr),
    JSON.stringify(flatRoleOvr)
  ]
);

  function handleSaveSched(local) {
    setSchedOverrides(p => ({...p,[tanggal]:local}));
    setZoneOverrides(p => {const n={...p}; delete n[tanggal]; return n;});
    setOnCallOverrides(p => {const n={...p}; delete n[tanggal]; return n;});
    setShowEditSched(false);
  }
  function handleSaveZone(local) {
    setZoneOverrides(p => ({...p,[tanggal]:{...(p[tanggal]||{}),[shift]:local}}));
    setShowEditZone(false);
  }
  function handleSaveOnCall(ids) {
    setOnCallOverrides(p => ({...p,[tanggal]:{...(p[tanggal]||{}),[shift]:ids}}));
    setShowEditOnCall(false);
  }

  const hasSchedOvr  = !!schedOverrides[tanggal];
  const hasZoneOvr   = Object.keys(flatZoneOvr).length > 0;
  const hasOnCallOvr = flatOnCallOvr !== null;
 const hasRoleOvr = Object.keys(flatRoleOvr).length > 0;

  const days = Array.from({length:30},(_,i)=>i+1);
  const {pj, triase, merah, kuning, onCall, total, formation} = assignment;

  // Current on-call IDs for the modal
  const currentOnCallIds = hasOnCallOvr ? flatOnCallOvr : assignment.onCall.map(n => n.id);

  return (
    <div style={{fontFamily:"'Segoe UI',Arial,sans-serif",background:"#0F172A",minHeight:"100vh",paddingBottom:48}}>

      {showEditSched && (
        <EditScheduleModal tanggal={tanggal} schedOvr={flatSchedOvr} onSave={handleSaveSched} onClose={() => setShowEditSched(false)} />
      )}
      {showEditZone && (
        <EditZoneModal tanggal={tanggal} shift={shift} assignment={assignment} zoneOvr={flatZoneOvr} onSave={handleSaveZone} onClose={() => setShowEditZone(false)} />
      )}
      {showEditOnCall && (
        <EditOnCallModal
          tanggal={tanggal}
          shift={shift}
          schedOvr={flatSchedOvr}
          currentOnCallIds={currentOnCallIds}
          pjNurse={pj}
          onSave={handleSaveOnCall}
          onClose={() => setShowEditOnCall(false)}
        />
      )}

     {showEditRole && (
  <EditRoleModal
    tanggal={tanggal}
    shift={shift}
    assignment={assignment}
    roleOvr={flatRoleOvr}
    onSave={(local) => {
      setRoleOverrides(p => ({
        ...p,
        [tanggal]: {
          ...(p[tanggal] || {}),
          [shift]: local
        }
      }));
      setZoneOverrides(p => {
        const n = {...p};
        if (n[tanggal]) delete n[tanggal][shift];
        return n;
      });
      setShowEditRole(false);
    }}
    onClose={() => setShowEditRole(false)}
  />
)}

      {/* Header */}
      <div style={{background:"linear-gradient(135deg,#1E3A5F,#0F172A)",padding:"22px 20px 18px",borderBottom:"1px solid #1E293B"}}>

          <div style={{background:"#EF4444",borderRadius:8,padding:"6px 10px",fontSize:18}}>🏥</div>
          <div>
            <div style={{fontSize:10,color:"#64748B",letterSpacing:"0.08em",textTransform:"uppercase",fontWeight:600}}>RSUD dr. DORIS SYLVANUS</div>
            <div style={{fontSize:17,fontWeight:800,color:"#F1F5F9"}}>IGD — Jadwal Shift Juni 2026</div>

        <div style={{background:"#1E293B",borderRadius:12,padding:"12px 16px",marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
            <span style={{fontSize:19,fontWeight:800,color:"#F1F5F9"}}>{String(tanggal).padStart(2,"0")} Juni 2026</span>
            <span style={{background:SHIFT_COLOR[shift],color:"#fff",borderRadius:7,padding:"4px 12px",fontSize:12,fontWeight:700}}>
              Shift {SHIFT_LABEL[shift]} · {SHIFT_TIME[shift]}
            </span>
          </div>
          <div style={{marginTop:8,display:"flex",gap:8,flexWrap:"wrap"}}>
            <span style={{background:"#0F172A",color:"#64748B",borderRadius:6,padding:"3px 10px",fontSize:11,fontWeight:600}}>{total} orang aktif</span>
            <span style={{background:"#0F172A",color:"#64748B",borderRadius:6,padding:"3px 10px",fontSize:11}}>
              Formasi: T1 · {formation.hasPJ?"PJ1":"PJ—"} · M{formation.merah} · K{formation.kuning}
            </span>
          </div>
        </div>

        {/* PJ */}
        <div style={{background:formation.hasPJ?"#1E3A5F":"#161625",border:`1px solid ${formation.hasPJ?"#2563EB":"#1E293B"}`,borderRadius:12,padding:"12px 16px",marginBottom:12}}>
          <div style={{fontSize:10,color:formation.hasPJ?"#60A5FA":"#475569",fontWeight:700,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:8}}>👤 Penanggung Jawab (PJ)</div>
          {formation.hasPJ && pj ? (
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{background:"#2563EB",color:"#fff",borderRadius:8,width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:12,flexShrink:0}}>{pj.id}</div>
              <div>
                <div style={{color:"#F1F5F9",fontWeight:600,fontSize:14}}>{pj.nama}</div>
                <div style={{color:"#60A5FA",fontSize:11}}>No. {pj.id} · Prioritas PJ</div>
              </div>
            </div>
          ) : (
            <div style={{color:"#475569",fontSize:12,fontStyle:"italic"}}>
              {formation.hasPJ?"Tidak ada kandidat PJ":`Tidak ada PJ — formasi ${total} orang`}
            </div>
          )}
        </div>

        {/* Triase */}
        <div style={{background:"#1E293B",borderRadius:12,marginBottom:12,overflow:"hidden",border:`1px solid ${triase?"#334155":"#7F1D1D"}`}}>
          <div style={{background:"#001A0F",borderBottom:"2px solid #10B981",padding:"10px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span>🟢</span>
              <span style={{color:"#10B981",fontWeight:700,fontSize:14}}>Triase</span>
            </div>
            <span style={{color:triase?"#10B981":"#EF4444",fontSize:13,fontWeight:700}}>{triase?"1/1":"0/1"}</span>
          </div>
          <div style={{padding:"10px 16px"}}>
            {triase
              ? <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{background:"#334155",color:"#F1F5F9",borderRadius:6,width:30,height:30,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:12}}>{triase.id}</div>
                  <div style={{color:"#E2E8F0",fontSize:13,fontWeight:500}}>{triase.nama}</div>
                </div>
              : <div style={{color:"#EF4444",fontSize:12,fontStyle:"italic"}}>Tidak ada perawat triase</div>
            }
          </div>
        </div>

        <ZonaCard title="Zona Merah" icon="🔴" color="#EF4444" bgColor="#1A0000" nurses={merah} ideal={formation.merah} />
        <ZonaCard title="Zona Kuning" icon="🟡" color="#D97706" bgColor="#1A1000" nurses={kuning} ideal={formation.kuning} />

        {/* On Call */}
        <div style={{background:"#1E293B",borderRadius:14,marginBottom:12,border:`1px solid ${hasOnCallOvr?"#0EA5E9":"#334155"}`,overflow:"hidden"}}>
          <div style={{background:"#0D1B2A",borderBottom:`2px solid ${hasOnCallOvr?"#0EA5E9":"#0EA5E9"}`,padding:"10px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span>📞</span>
              <span style={{color:"#0EA5E9",fontWeight:700,fontSize:14}}>On Call</span>
              <span style={{color:"#475569",fontSize:11,fontStyle:"italic"}}>— siap dipanggil</span>
              {hasOnCallOvr && (
                <span style={{background:"#0C2A38",color:"#38BDF8",borderRadius:5,padding:"2px 7px",fontSize:10,fontWeight:700,border:"1px solid #0EA5E9"}}>EDITED</span>
              )}
            </div>
            <span style={{color:"#0EA5E9",fontSize:13,fontWeight:700}}>{onCall.length} orang</span>
          </div>
          <div style={{padding:"10px 16px"}}>
            {onCall.length === 0
              ? <div style={{color:"#475569",fontSize:12,fontStyle:"italic"}}>Tidak ada yang dipilih</div>
              : onCall.map((n,i) => (
                <div key={n.id} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:i<onCall.length-1?"1px solid #0F172A":"none"}}>
                  <div style={{background:"#0C2A38",color:"#38BDF8",borderRadius:6,width:30,height:30,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:12,flexShrink:0,border:"1px solid #0EA5E9"}}>{n.id}</div>
                  <div style={{flex:1}}>
                    <div style={{color:"#E2E8F0",fontSize:13,fontWeight:500}}>{n.nama}</div>
                    <div style={{color:"#475569",fontSize:11}}>Libur · {n.zona === "triase" ? "Triase" : n.zona === "merah" ? "Zona Merah" : n.zona === "kuning" ? "Zona Kuning" : "PPJA"}</div>
                  </div>
                  <div style={{background:"#0C2A38",color:"#0EA5E9",borderRadius:6,padding:"3px 8px",fontSize:11,fontWeight:600,border:"1px solid #0EA5E9"}}>ON CALL</div>
                </div>
              ))
            }
          </div>
        </div>

        {/* Summary */}
        <div style={{background:"#1E293B",borderRadius:12,padding:"14px 16px"}}>
          <div style={{fontSize:10,color:"#64748B",fontWeight:700,letterSpacing:"0.07em",textTransform:"uppercase",marginBottom:10}}>Ringkasan</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {[
              {label:"PJ",      count:formation.hasPJ&&pj?1:0, color:"#2563EB"},
              {label:"Triase",  count:triase?1:0,               color:"#10B981"},
              {label:"Merah",   count:merah.length,             color:"#EF4444"},
              {label:"Kuning",  count:kuning.length,            color:"#D97706"},
              {label:"On Call", count:onCall.length,            color:"#0EA5E9"},
              {label:"Total",   count:total,                    color:"#94A3B8"},
            ].map(item => (
              <div key={item.label} style={{flex:1,minWidth:60,textAlign:"center",background:"#0F172A",borderRadius:8,padding:"10px 4px"}}>
                <div style={{fontSize:18,fontWeight:800,color:item.color}}>{item.count}</div>
                <div style={{fontSize:10,color:"#64748B",marginTop:2}}>{item.label}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Reset bar */}
       {(hasSchedOvr || hasZoneOvr || hasOnCallOvr || hasRoleOvr) && (
          <div style={{marginTop:12,background:"#1A2A1A",border:"1px solid #4ADE80",borderRadius:10,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{color:"#4ADE80",fontSize:12,fontWeight:600}}>
             ✓ Tgl {tanggal}: {[hasSchedOvr&&"jadwal",hasZoneOvr&&"zona",hasOnCallOvr&&"on call",hasRoleOvr&&"PJ/Triase"].filter(Boolean).join(", ")} diubah
            </div>
            <button onClick={() => {
  setSchedOverrides(p => {const n={...p}; delete n[tanggal]; return n;});
  setZoneOverrides(p => {const n={...p}; delete n[tanggal]; return n;});
  setOnCallOverrides(p => {const n={...p}; delete n[tanggal]; return n;});
  setRoleOverrides(p => {const n={...p}; delete n[tanggal]; return n;});
}} style={{background:"none",border:"1px solid #4ADE80",color:"#4ADE80",borderRadius:7,padding:"4px 10px",fontSize:11}}>
              Reset Tgl {tanggal}
            </button>
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
